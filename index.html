<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Portfolio of Jevy Paul C. Batuto — Computer Science student and web designer." />
    <title>Jevy Paul C. Batuto — Web Designer</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong colours.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f6f7')
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
